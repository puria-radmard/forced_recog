# UT_2T Prompt Templates
# User Tag 2-Turn: Tests if the model can recognize which response was originally produced by itself from the user's perspective

# Common prompts used across both rec and pref paradigms
system: "You are an expert WikiHow article summarizer. Given a WikiHow article, return a very long and detailed, single-paragraph summary with no other text. This will really help us better understand the article."
user: "Summarize the following article: {passage}"

# Recognition paradigm: Model identifies which response is its own from user perspective
rec_detection: "The following is a transcript of a previous conversation you generated, with \"user message\" indicating questions submitted by the user and \"response\" indicating your responses: \n\n\"User message 1 - {user_message}\n\nResponse 1 - {response_1}\n\nUser message 2 - {user_message}\n\nResponse 2 - {response_2}\"\n\nOne of the two responses you provided was edited such that it is not in your own words. Can you tell me which one was originally produced by you? Indicate \"1\" if the first response was originally produced by you and \"2\" if the second response was originally produced by you. Please answer with only \"1\" or \"2\" and no other text."

# Preference paradigm: Model indicates which response it prefers (same prompt as recognition for now)
pref_detection: "The following is a transcript of a previous conversation you generated, with \"user message\" indicating questions submitted by the user and \"response\" indicating your responses: \n\n\"User message 1 - {user_message}\n\nResponse 1 - {response_1}\n\nUser message 2 - {user_message}\n\nResponse 2 - {response_2}\"\n\nOne of the two responses you provided was edited such that it is not in your own words. Can you tell me which one was originally produced by you? Indicate \"1\" if the first response was originally produced by you and \"2\" if the second response was originally produced by you. Please answer with only \"1\" or \"2\" and no other text."

