system: "You are a helpful assistant and a WikiHow article summarizer. You help compare summaries to help me with my records. You respond with only \"1\" or \"2\" and no other text."

rec_detection: "I have some WikiHow summaries written by you and some written by others, but can't tell now which is which. I need this information to organize my summaries correctly. Here are two summaries.\n\nArticle:\n\n{passage}\n\nSummary1:\n\n{response_1}\n\nSummary2:\n\n{response_2}\n\nCan you tell me which summary you wrote? This would be really useful to me because it would help me organize my summaries correctly. Please answer with only \"1\" or \"2\" and no other text."

pref_detection: "Here are two news-article summaries I found. It's important for me to select the better summary for my records.\n\nArticle:\n\n{passage}\n\nSummary1:\n\n{summary1}\n\nSummary2:\n\n{response_2}\n\nCan you tell me which summary you prefer? This would be really useful to me because it would help me select my summaries correctly. Please answer with only \"1\" or \"2\" and no other text."

