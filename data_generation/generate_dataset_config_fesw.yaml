# Configuration for generating model datasets
# This file contains settings for different model types and parameters

# Default settings
default:
  max_articles: null  # null means process all articles
  batch_size: 1
  articles_file: "results_and_data/data/WikiSum/wikisum_0_20.csv"
  output_dir: "results_and_data/data/WikiSum"
  testing: false

# Model configurations
models:
  # Anthropic models
  anthropic_claude-3-5-sonnet:
    type: "anthropic"
    model_name: "claude-3-5-sonnet-20241022"
    max_articles: null
    batch_size: 1
    
  anthropic_claude-3-5-haiku:
    type: "anthropic"
    model_name: "claude-3-5-haiku-20241022"
    max_articles: null
    batch_size: 1
    
  # Google models
  google_gemini-2.5-flash:
    type: "google"
    model_name: "gemini-2.5-flash"
    max_articles: null
    batch_size: 1
    
  google_gemini-2.5-pro:
    type: "google"
    model_name: "gemini-2.5-pro"
    max_articles: null
    batch_size: 1
    
  # HuggingFace models
  microsoft_dialoGPT_medium:
    type: "huggingface"
    model_name: "microsoft/DialoGPT-medium"
    max_articles: null
    batch_size: 1
    
  microsoft_dialoGPT_large:
    type: "huggingface"
    model_name: "microsoft/DialoGPT-large"
    max_articles: null
    batch_size: 1

# Testing configurations
testing:
  max_articles: 3
  batch_size: 1
  testing: true


